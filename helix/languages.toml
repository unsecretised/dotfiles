[[language]]
name = "astro"
scope = "source.astro"
injection-regex = "astro"
file-types = ["astro"]
roots = ["package.json", "astro.config.js", "astro.config.mjs"]
language-servers = ["astro-ls"]
formatter = { command = "prettier", args = ["--plugin", "prettier-plugin-astro", "--parser", "astro"] }
auto-format = true

[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
# Point this tsdk path to your global or local TypeScript library
config = { typescript = { tsdk = "/Users/umangsurana/.nvm/versions/node/v23.6.0/lib/node_modules" } }

[[language]]
name = "swift"
auto-format = true
language-servers = ["sourcekit-lsp"]
formatter = { command = "swiftformat", args = ["--stdinpath", "%{buffer_name}", "-"] }

[language.debugger]
command = "lldb-dap"
name = "lldp-dap"
port-arg = "--port {}"
transport = "tcp"

[[language.debugger.templates]]
name = "binary"
request = "launch"
[[language.debugger.templates.completion]]
completion = "filename"
name = "binary"

[language.debugger.templates.args]
program = "{0}"
runInTerminal = true

[[grammar]]
name = "swift"
source = { git = "https://github.com/alex-pinkus/tree-sitter-swift", rev = "57c1c6d6ffa1c44b330182d41717e6fe37430704" }

[[language]]
name = "cpp"
language-servers = [ "clangd" ]

[language-server.clangd]
command = "clangd"
args = ["--fallback-style=LLVM", "-I/usr/local/include"]

[[language]]
name = "python"
language-servers = ["pyright"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true

[language-server.pyright]
command = "pyright"

[[language]]
name = "zig"
language-servers = ["zls"]

[language-server.zls]
command = "zls"

[[language]]
name = "gleam"
language-servers = ["gleam"]
formatter = { command = "gleam", args = ["format", "-"] }
auto-format = true

[language-server.gleam]
command = "gleam"
args = ["lsp"]

[[language]]
name = "typescript"
language-servers = ["typescript-language-server"]

[[language]]
name = "javascript"
language-servers = ["typescript-language-server"]

[[language]]
name = "tsx"
language-servers = ["typescript-language-server"]

[[language]]
name = "jsx"
language-servers = ["typescript-language-server"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[[language]]
name = "css"
language-servers = ["vscode-css-language-server"]

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]
